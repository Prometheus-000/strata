# Runs every test, then builds the six surfaces into one static site and
# publishes it at https://prometheus-000.github.io/strata/. The build runs
# `strata check --enforce`: only an invariant — the record parses, the
# projections match it, every fallback chain ends, every var() resolves —
# can fail it. A design that is different is reported, never refused.
# The write-through endpoint is dev-server only; on the static site the
# harness falls back to localStorage, which its provider already does when
# no server answers.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # The newcomer's path, from a clean checkout, on every push. Nothing else
  # here exercises it: `npm test` and `npm run build` reach the CLI only
  # through `npm run`, which supplies the loader and the working directory,
  # and for a year that is why `npx strata` stayed broken in the README while
  # every check was green.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the CLI, as a product that installed it runs it
        run: |
          npx strata check
          npx strata skill
          npx strata rebuild --check
      - name: a product Strata starts, in an empty directory
        run: |
          npm pack --pack-destination /tmp
          mkdir /tmp/new && cd /tmp/new && git init -q && npm init -y
          npm i -D /tmp/strata-design-*.tgz
          npx strata init --yes
          npx strata check --enforce
          npx strata retheme --hue 20 --chroma 0.12 --why "a smoke test" --decided-by human --actor ci
          npx strata check --enforce
          npx strata rebuild --check
          test -s .strata/decisions.jsonl

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix strata-malleable
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /strata/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
